[package]
name = "rhythm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"] # cdylib for Android, rlib so main.rs can use it
path = "src/lib.rs"
name = "rhythm_lib"

[[bin]]
name = "rhythm"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.1"
chrono = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.19.0"
sysdirs = { version = "0.10.2", features = ["android-auto"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webbrowser = "1.2.7"

[target.'cfg(not(target_os = "android"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.19.0"

[package.metadata.android]
package = "org.HiBalance.rhythm"
apk_name = "rhythm"
resources = "android"

[package.metadata.android.application]
label = "Rhythm"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rhythm_lib"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

